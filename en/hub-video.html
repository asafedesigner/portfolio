<title>AI Hub in motion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
/* Layout: palco 16:9 fixo (1920x1080) escalado para caber; legenda à esquerda, dispositivo à direita que se transforma de desktop em celular. */
:root{
  --stage:#0d0f0c; --stage-2:#141a10; --ink:#f3f6ef; --ink-2:#a9b5a0; --ink-3:#6f7b67;
  --green:#78be42; --green-d:#486d2b; --green-dd:#1c2e10; --green-l:#e8f2df;
  --ui-bg:#ffffff; --ui-soft:#f4f4f4; --ui-line:#ececec; --ui-text:#333333; --ui-muted:#8b8b8b;
  --red:#b3261e; --red-l:#fbe9e7;
  --font:'Hanken Grotesk',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);overflow:hidden}
.material-icons{font-family:'Material Icons';font-weight:normal;font-style:normal;line-height:1;display:inline-block;-webkit-font-smoothing:antialiased;font-feature-settings:'liga'}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:radial-gradient(1100px 700px at 68% 52%, #1b2a12 0%, rgba(27,42,18,0) 70%), radial-gradient(900px 600px at 10% 100%, #12180e 0%, rgba(18,24,14,0) 70%), var(--stage)}
#stage.no-anim, #stage.no-anim *{transition:none!important;animation:none!important}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(120,190,66,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(120,190,66,.04) 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(900px 600px at 68% 50%, #000 0%, transparent 75%)}

/* ---------- Intro / outro ---------- */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;z-index:6;
  opacity:0;transform:translateY(24px);transition:opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.overlay.on{opacity:1;transform:none}
.overlay.out{opacity:0;transform:translateY(-24px) scale(.98)}
.brandline{display:flex;align-items:center;gap:16px;font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.pulse{width:14px;height:14px;border-radius:99px;background:var(--green);box-shadow:0 0 0 0 rgba(120,190,66,.6);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(120,190,66,.55)}70%{box-shadow:0 0 0 18px rgba(120,190,66,0)}100%{box-shadow:0 0 0 0 rgba(120,190,66,0)}}
.headline{margin:0;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.035em;max-width:1300px;text-wrap:balance}
.headline em{font-style:normal;color:var(--green)}
.sub{margin:0;font-size:28px;font-weight:500;color:var(--ink-2);letter-spacing:.01em}
.word{display:inline-block;opacity:0;transform:translateY(40px);transition:opacity .6s ease, transform .8s cubic-bezier(.2,.8,.2,1)}
.overlay.on .word{opacity:1;transform:none}
.states-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1400px}
.spill{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 10px;border-radius:99px;font-size:22px;font-weight:600;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--ink-3);transition:all .5s ease}
.spill b{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.06);font-size:15px;color:var(--ink-3);transition:all .5s ease}
.spill.lit{color:var(--ink);background:rgba(120,190,66,.12);box-shadow:inset 0 0 0 1px rgba(120,190,66,.5)}
.spill.lit b{background:var(--green);color:var(--green-dd)}

/* ---------- Legenda ---------- */
#caption{position:absolute;left:140px;top:50%;width:470px;transform:translateY(-50%);display:flex;flex-direction:column;gap:26px;z-index:4;
  opacity:0;transition:opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1)}
#caption.on{opacity:1}
#caption.out{opacity:0;transform:translate(-40px,-50%)}
.devpill{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 18px 0 14px;border-radius:99px;
  background:rgba(120,190,66,.12);box-shadow:inset 0 0 0 1px rgba(120,190,66,.35);color:#c3e3a3;font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.devpill .material-icons{font-size:22px}
.cap-body{display:flex;flex-direction:column;gap:16px}
.cap-idx{font-weight:600;font-size:20px;letter-spacing:.14em;color:var(--green);font-variant-numeric:tabular-nums}
.cap-name{margin:0;font-weight:800;font-size:64px;line-height:1;letter-spacing:-.03em;text-wrap:balance}
.cap-desc{margin:0;font-weight:500;font-size:24px;line-height:1.4;color:var(--ink-2);text-wrap:pretty}
.devpill.swap,.cap-body.swap{animation:capIn .7s cubic-bezier(.2,.7,.2,1)}
@keyframes capIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
.track{display:flex;gap:8px}
.track i{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .5s ease}
.track i.done{background:var(--green-d)}
.track i.cur{background:var(--green)}

/* ---------- Dispositivo (morph) ---------- */
#shell{position:absolute;left:1255px;top:540px;width:1088px;height:720px;border-radius:18px;background:#1a1d18;
  transform:translate(-50%,-50%) perspective(2400px) rotateX(14deg) translateY(120px) scale(.94);opacity:0;
  box-shadow:0 60px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);overflow:hidden;z-index:3;
  transition:width 1.2s cubic-bezier(.75,0,.2,1), height 1.2s cubic-bezier(.75,0,.2,1), border-radius 1.2s cubic-bezier(.75,0,.2,1), transform 1.2s cubic-bezier(.2,.7,.2,1), opacity .8s ease, left 1.2s cubic-bezier(.75,0,.2,1)}
#shell.on{opacity:1;transform:translate(-50%,-50%)}
#shell.phone{width:414px;height:868px;border-radius:56px;left:1210px}
#shell.out{opacity:0;transform:translate(-50%,-50%) scale(.9)}
.layer{position:absolute;transition:opacity .45s ease}
#deskLayer{left:0;top:0;width:1088px;height:720px}
#mobLayer{left:50%;top:50%;width:414px;height:868px;margin:-434px 0 0 -207px;opacity:0;padding:12px;box-sizing:border-box}
#shell.phone #deskLayer{opacity:0}
#shell.phone #mobLayer{opacity:1;transition-delay:.7s}
.titlebar{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#22261f}
.titlebar i{width:12px;height:12px;border-radius:99px;background:#3a4035}
.url{margin-left:18px;flex:1;max-width:460px;height:24px;border-radius:6px;background:#2d3329;color:#9aa592;font-size:13px;display:flex;align-items:center;gap:6px;padding:0 10px}
.url .material-icons{font-size:13px}
.deskwrap{width:1088px;height:680px;overflow:hidden;position:relative}
#desk{width:1280px;height:800px;transform:scale(.85);transform-origin:top left;background:var(--ui-bg);color:var(--ui-text);display:flex;position:relative}

/* ---------- UI do Hub de IA (desktop) ---------- */
.side{width:240px;flex:none;background:#f7f9f4;border-right:1px solid var(--ui-line);display:flex;flex-direction:column;gap:20px;padding:22px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--green-d);letter-spacing:-.01em}
.logo span.mk{width:28px;height:28px;border-radius:8px;background:var(--green);display:grid;place-items:center;color:var(--green-dd)}
.logo .mk .material-icons{font-size:18px}
.newchat{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;background:var(--green);color:var(--green-dd);font-weight:600;font-size:14px}
.newchat .material-icons{font-size:18px}
.sgroup{display:flex;flex-direction:column;gap:2px}
.slabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-muted);padding:0 10px 8px}
.sitem{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:6px;font-size:14px;color:#4a4a4a;white-space:nowrap;overflow:hidden}
.sitem .material-icons{font-size:17px;color:#8b8b8b}
.sitem.act{background:var(--green-l);color:var(--green-dd);font-weight:600}
.sitem.act .material-icons{color:var(--green-d)}
.mainc{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;flex:none;border-bottom:1px solid var(--ui-line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.crumb{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ui-muted)}
.crumb b{color:var(--ui-text);font-weight:600}
.credits{display:flex;align-items:center;gap:10px;font-size:13px;color:#607f3f;font-weight:600;font-variant-numeric:tabular-nums}
.credits .material-icons{font-size:17px}
.cbar{width:90px;height:5px;border-radius:99px;background:#e0e0e0;overflow:hidden}
.cbar i{display:block;height:100%;width:40%;background:var(--green);transition:width .6s ease}
.avatar{width:32px;height:32px;border-radius:99px;background:#dfe9d4;color:var(--green-d);display:grid;place-items:center;font-weight:700;font-size:13px}
.thread{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.col{width:720px;margin:0 auto;display:flex;flex-direction:column;padding:24px 0 8px}
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .65s cubic-bezier(.3,.7,.2,1), opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1);transform:translateY(14px)}
.reveal>.in{overflow:hidden;min-height:0}
.reveal.on{grid-template-rows:1fr;opacity:1;transform:none}
.reveal.gone{grid-template-rows:0fr;opacity:0;transform:translateY(-10px)}
.pad{padding-bottom:22px}
.h1{margin:0;font-weight:800;font-size:38px;line-height:1.05;color:var(--green-d);letter-spacing:-.02em}
.lead{margin:10px 0 0;font-size:16px;line-height:1.45;color:var(--ui-muted);font-weight:500}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.app{position:relative;display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--ui-line);transition:box-shadow .3s ease, background .3s ease, transform .3s ease}
.app .material-icons{font-size:24px;color:var(--green)}
.app b{font-size:16px;font-weight:600}
.app span.d{font-size:13px;line-height:1.4;color:var(--ui-muted)}
.app .tg{position:absolute;right:14px;top:14px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--green-l);color:var(--green-d)}
.app.hot{box-shadow:inset 0 0 0 2px var(--green);background:#fbfdf8;transform:translateY(-2px)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:600;
  box-shadow:inset 0 0 0 1px #dcdcdc;color:#4a4a4a;background:#fff;white-space:nowrap;transition:all .3s ease}
.btn .material-icons{font-size:16px}
.btn.sq{border-radius:8px;height:38px;font-size:14px}
.btn.pri{background:var(--green);color:var(--green-dd);box-shadow:none}
.btn.sel{background:var(--green-l);box-shadow:inset 0 0 0 2px var(--green);color:var(--green-dd)}
.btn.hov{box-shadow:inset 0 0 0 2px var(--green-d)}
.bubble-row{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.bubble{max-width:80%;background:var(--ui-soft);border-radius:10px;padding:12px 16px;font-size:15px;line-height:1.45;font-weight:500}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;background:#efefef;color:#4a4a4a;white-space:nowrap}
.tag .material-icons{font-size:14px}
.tag.ok{background:var(--green-l);color:#3d5a24}
.tag.err{background:var(--red-l);color:var(--red)}
.card{background:var(--ui-soft);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--ui-muted);opacity:0;transform:translateX(-8px);transition:all .45s ease}
.step.on{opacity:1;transform:none}
.step.done{color:var(--green-d)}
.step .material-icons{font-size:16px}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:5px;border-radius:99px;background:#e0e0e0;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;width:0;background:var(--green);border-radius:99px}
.rowsb{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ui-muted);font-variant-numeric:tabular-nums}
.ptxt{margin:0;font-size:15px;line-height:1.5;font-weight:500}
.opts{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-muted)}

const on = (id) => $(id).classList.add('on');
const off = (id) => $(id).classList.remove('on');
const cls = (id, c, v=true) => $(id).classList.toggle(c, v);
const ease = (p) => p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
const lerp = (a,b,p) => a+(b-a)*p;
const replay = (el, c) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };
const STATES = [
  ['Empty state','The empty screen already offers paths: ready-made apps and suggested requests, no prompt required.'],
  ['Input','Chips lock the scope. It is explicit which documents the AI will answer from.'],
  ['Latency','Named steps, a running count and the Stop button always within reach.'],
  ['Disambiguation','Two current checklist revisions. The AI asks before choosing for you.'],
  ['Output','Compliance becomes a table: status and source on every row, with the cost stated.'],
  ['Refinement','Follow-ups derived from the result: filter, group, export, regenerate.'],
  ['No evidence','Not finding is a result. The screen shows what was searched and the closest match.']
];
function caption(n, instant, override){
  const [name, desc] = STATES[n-1];
  $('capidx').textContent = String(n).padStart(2,'0') + ' / 07';
  $('capname').textContent = override?.name || name;
  $('capdesc').textContent = override?.desc || desc;
  [...$('track').children].forEach((el,i)=>{ el.className = i<n-1 ? 'done' : i===n-1 ? 'cur' : ''; });
  if(!instant) replay($('capbody'),'swap');
}
function device(mobile, instant){
  $('devicon').textContent = mobile ? 'smartphone' : 'desktop_windows';
  $('devname').textContent = mobile ? 'Mobile' : 'Desktop';
  if(!instant) replay($('devpill'),'swap');
}
function typer(id, text){
  return (p) => {
    const el = $(id); const n = Math.round(text.length*p);
    el.classList.toggle('ph', false);
    el.innerHTML = '';
    el.append(document.createTextNode(text.slice(0,n)));
    if(p<1){ const c=document.createElement('span'); c.className='caret'; el.append(c); }
    // keep the end of the text visible while typing
    el.scrollLeft = el.scrollWidth;
  };
}
function counter(id, from, to){ return (p) => { $(id).textContent = Math.round(lerp(from,to,p)).toLocaleString('en-US'); }; }

/* ---- Cursores: posição calculada a partir do elemento-alvo ---- */
const CUR = {
  d: { el:'dCursor', screen:'desk', w:1280, tip:[5,3] },
  m: { el:'mTouch',  screen:'mob',  w:390,  tip:[0,0] }
};
function targetPos(kind, t){
  if(Array.isArray(t)) return {x:t[0], y:t[1]};
  const scr = $(CUR[kind].screen).getBoundingClientRect();
  const k = scr.width / CUR[kind].w;
  const r = (typeof t==='string' ? $(t) : t.el ? $(t.el) : null).getBoundingClientRect();
  const fx = t.fx ?? .5, fy = t.fy ?? .5;
  return { x:(r.left + r.width*fx - scr.left)/k, y:(r.top + r.height*fy - scr.top)/k };
}
const curState = { d:{x:900,y:720}, m:{x:300,y:780} };
function setCur(kind, pos){
  curState[kind] = pos;
  const c = CUR[kind]; const el = $(c.el);
  el.style.transform = `translate(${pos.x - c.tip[0]}px, ${pos.y - c.tip[1]}px)`;
}
function moveCur(kind, target){
  let from = null, to = null;
  return { fn:(p) => {
    if(!from) from = {...curState[kind]};
    to = targetPos(kind, target);
    const e = ease(p);
    // leve arco no caminho, como um gesto real
    const arc = Math.sin(Math.PI*e) * -30;
    setCur(kind, { x: lerp(from.x,to.x,e), y: lerp(from.y,to.y,e) + arc });
  }, reset:()=>{ from=null; } };
}
function click(kind){
  if(kind==='d'){ const r=$('dRipple'); const p=curState.d; r.style.left=p.x+'px'; r.style.top=p.y+'px'; replay(r,'go'); }
  else replay($('mTouch'),'tap');
}

/* ---- Linha do tempo ---- */
// events: [t, fn(instant)] ; tweens: [t0, t1, fn(p)] ; cursor moves are tweens too
const E = [], T = [];
const at = (t, fn) => E.push([t, fn]);
const tw = (t0, t1, f) => { const o = typeof f==='function' ? {fn:f} : f; T.push([t0, t1, o]); };

// Intro
at(0.1, ()=> on('intro'));
at(2.9, ()=> cls('intro','out'));
// Entrada do desktop
at(3.1, (i)=> { on('shell'); on('caption'); caption(1, true); device(false, true); });
at(3.0, ()=> { $('dcbar').style.width='40%'; });
// 01 → 02 : cursor clica no aplicativo
at(4.0, ()=> on('dCursor'));
tw(4.0, 5.0, moveCur('d', {el:'appVal', fx:.35, fy:.55}));
at(4.9, ()=> cls('appVal','hot'));
at(5.15,()=> click('d'));
at(5.4, (i)=> { caption(2, i); cls('dInput','focus'); });
at(5.6, ()=> $('dChips').children[0].classList.add('on'));
at(5.8, ()=> $('dChips').children[1].classList.add('on'));
at(6.0, ()=> $('dChips').children[2].classList.add('on'));
tw(6.0, 8.0, typer('dText','Validate the Serra Azul project documents against the compliance checklist.'));
at(8.0, ()=> cls('dSend','ready'));
tw(7.7, 8.4, moveCur('d', 'dSend'));
at(8.5, ()=> { click('d'); replay($('dSend'),'press'); });
// 03 Latência
at(8.7, (i)=> {
  caption(3, i); cls('appVal','hot',false); cls('dInput','focus',false);
  cls('dZero','on',false); cls('dZero','gone'); on('dBubble');
  $('dText').className='itext ph'; $('dText').textContent='Validating 212 documents…';
  cls('dSend','ready',false); cls('dSend','stop'); $('dSendIc').textContent='stop';
  [...$('dChips').children].forEach(c=>c.classList.remove('on'));
});
at(9.0, ()=> on('dLat'));
tw(9.0, 9.8, moveCur('d', [1180, 760]));
at(9.4, ()=> { on('st1'); cls('st1','done'); });
at(10.0,()=> { on('st2'); cls('st2','done'); });
at(10.6,()=> on('st3'));
tw(9.4, 12.0, (p)=> { $('dbar').style.width = (lerp(0,40,p))+'%'; });
tw(9.6, 12.0, counter('dcount', 0, 84));
tw(10.2, 12.0, counter('dfail', 0, 3));
// 04 Desambiguação
at(12.2, (i)=> { caption(4, i); cls('dLat','on',false); cls('dLat','gone'); on('dDes'); });
tw(12.8, 13.7, moveCur('d', {el:'optRev07', fx:.3}));
at(13.6, ()=> cls('optRev07','hov'));
at(13.85,()=> { click('d'); cls('optRev07','hov',false); cls('optRev07','sel'); });
// 05 Output
at(14.3, (i)=> {
  caption(5, i); cls('dDes','on',false); cls('dDes','gone'); on('dOut');
  $('dText').className='itext ph'; $('dText').textContent='Ask anything';
  cls('dSend','stop',false); $('dSendIc').textContent='arrow_upward';
  [...$('dChips').children].forEach(c=>c.classList.add('on'));
});
tw(14.3, 15.0, moveCur('d', [1160, 330]));
[14.6, 14.8, 15.0, 15.2].forEach((t, k)=> at(t, ()=> $('dOut').querySelectorAll('.tr:not(.th)')[k].classList.add('on')));
tw(14.4, 15.4, counter('dcred', 800, 803));
at(14.4, ()=> { $('dcbar').style.width='40.2%'; });
// 06 Refinamento
at(16.0, (i)=> { caption(6, i); on('dRef'); });
[16.2,16.35,16.5,16.65].forEach((t,k)=> at(t, ()=> $('dRef').querySelectorAll('.btn')[k].classList.add('on')));
tw(16.6, 17.5, moveCur('d', {el:'refFail', fx:.4}));
at(17.5, ()=> cls('refFail','hov'));
// Transição para mobile
at(18.6, ()=> off('dCursor'));
at(18.8, (i)=> { cls('shell','phone'); caption(5, i, {name:'Same answer, two sizes', desc:'The table becomes a list of cards. Status and source stay on every row.'}); device(true, i); });
[19.9,20.05,20.2,20.35].forEach((t,k)=> at(t, ()=> $('mOut').querySelectorAll('.mcard')[k].classList.add('on')));
at(18.0, ()=>{ $('mOut').querySelectorAll('.mcard').forEach(c=>c.classList.remove('on')); });
at(21.4, (i)=> { caption(6, i, {desc:'The same follow-ups, within thumb reach.'}); on('mRef');
  $('mRef').querySelectorAll('.btn').forEach(b=>b.classList.add('on')); });
// 07 Ausência no mobile
at(22.4, ()=> { setCur('m', {x:300,y:840}); on('mTouch'); });
tw(22.4, 23.0, moveCur('m', 'mInput'));
at(23.1, ()=> { click('m'); cls('mInput','focus'); });
tw(23.3, 24.9, typer('mText','What about the 2019 geotechnical report for the north slope?'));
at(24.9, ()=> cls('mSend','ready'));
tw(24.8, 25.3, moveCur('m', 'mSend'));
at(25.4, ()=> { click('m'); replay($('mSend'),'press'); });
at(25.6, (i)=> {
  caption(7, i); cls('mInput','focus',false); cls('mSend','ready',false);
  $('mText').className='itext ph'; $('mText').textContent='Ask anything';
  on('mBubble2'); on('mLat');
});
at(25.9, ()=> off('mTouch'));
tw(25.7, 27.0, (p)=> { $('mbar').style.width = (p*100)+'%'; });
at(27.1, ()=> { cls('mLat','on',false); cls('mLat','gone'); on('mAbs1'); });
at(27.5, ()=> on('mAbs2'));
at(27.9, ()=> on('mAbs3'));
at(28.3, ()=> on('mAbs4'));
// Outro
at(31.0, ()=> { cls('shell','out'); cls('caption','out'); });
at(31.6, ()=> on('outro'));
[32.0,32.2,32.4,32.6,32.8,33.0,33.2].forEach((t,k)=> at(t, ()=> $('spills').children[k].classList.add('lit')));
at(35.4, ()=> { cls('outro','out'); });

E.sort((a,b)=>a[0]-b[0]);

/* ---- Motor ---- */
let t = 0, playing = true, last = null, ei = 0;
const done = new Set();
function build(){
  stage.innerHTML = '';
  stage.append(tpl.content.cloneNode(true));
  T.forEach(([, , o])=> o.reset && o.reset());
  done.clear(); ei = 0;
  curState.d = {x:900,y:720}; curState.m = {x:300,y:780};
  setCur('d', curState.d); setCur('m', curState.m);
}
function applyUntil(time, instant){
  while(ei < E.length && E[ei][0] <= time){ E[ei][1](instant); ei++; }
  T.forEach((tr, k)=>{
    const [t0,t1,o] = tr;
    if(time < t0 || done.has(k)) return;
    const p = Math.min(1, (time-t0)/(t1-t0));
    o.fn(p);
    if(p>=1) done.add(k);
  });
}
function seek(time){
  t = Math.max(0, Math.min(DUR, time));
  stage.classList.add('no-anim');
  build();
  for(let s=0; s<t; s+=0.05) applyUntil(s, true);
  applyUntil(t, true);
  void stage.offsetWidth;
  stage.classList.remove('no-anim');
  ui();
}
function frame(now){
  if(last==null) last = now;
  const dt = Math.min(.1, (now-last)/1000); last = now;
  if(playing){
    t += dt;
    if(t >= DUR){ seek(0); }
    else applyUntil(t, false);
    ui();
  }
  requestAnimationFrame(frame);
}
const fmt = (s)=> Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function ui(){
  $('fill').style.width = (t/DUR*100)+'%';
  $('time').textContent = fmt(t)+' / '+fmt(DUR);
  $('scrub').setAttribute('aria-valuenow', Math.round(t));
}
function setPlaying(v){
  playing = v;
  $('icPlay').textContent = v ? 'pause' : 'play_arrow';
  $('bPlay').setAttribute('aria-label', v ? 'Pause' : 'Play');
  stage.style.setProperty('--ps', v ? 'running' : 'paused');
}

window.__seek = (s)=>{ setPlaying(false); seek(s); };
/* ---- Controles ---- */
$('bPlay').addEventListener('click', ()=> setPlaying(!playing));
$('bRestart').addEventListener('click', ()=> { seek(0); setPlaying(true); });
[3.1,5.4,8.7,12.2,14.3,16.0,18.8,25.6,31.0].forEach(s=>{ const d=document.createElement('div'); d.className='tick'; d.style.left=(s/DUR*100)+'%'; $('scrub').append(d); });
let drag = false;
function scrubTo(e){ const r=$('scrub').getBoundingClientRect(); seek((e.clientX-r.left)/r.width*DUR); }
$('scrub').addEventListener('pointerdown', (e)=>{ drag=true; $('scrub').setPointerCapture(e.pointerId); scrubTo(e); });
$('scrub').addEventListener('pointermove', (e)=>{ if(drag) scrubTo(e); });
$('scrub').addEventListener('pointerup', ()=>{ drag=false; });
$('scrub').addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight'){ seek(t+2); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ seek(t-2); e.preventDefault(); }
});
document.addEventListener('keydown', (e)=>{ if(e.code==='Space' && e.target===document.body){ e.preventDefault(); setPlaying(!playing); } });
let idleT; function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>{ if(playing) document.body.classList.add('idle'); }, 2600); }
['pointermove','pointerdown','keydown'].forEach(ev=> document.addEventListener(ev, wake)); wake();

// Pausa automática fora da aba
document.addEventListener('visibilitychange', ()=>{ last = null; });

/* ---- Início ---- */
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const startAt = reduce ? 15.6 : 0;
const go = ()=> { seek(startAt); if(reduce) setPlaying(false); requestAnimationFrame(frame); };
if(document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
})();
</script>
